[package]
name = "daily-brief"
version = "0.1.0"
description = "Daily brief: your meetings, turned into your day"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.1"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
